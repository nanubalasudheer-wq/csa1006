<!DOCTYPE html>
<html>
<head>
    <title>My Automatic CI/CD Website</title>

    <style>
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: linear-gradient(to right, #141e30, #243b55);
            color: white;
            text-align: center;
        }

        header {
            padding: 80px 20px;
        }

        h1 {
            font-size: 42px;
            color: #00e6ff;
        }

        p {
            font-size: 20px;
        }

        .card {
            background: white;
            color: #243b55;
            padding: 30px;
            margin: 20px auto;
            width: 70%;
            max-width: 500px;
            border-radius: 12px;
        }

        footer {
            padding: 20px;
            margin-top: 50px;
        }
    </style>
</head>

<body>

    <header>
        <h1>Welcome to My Automatic CI/CD Website!</h1>
        <p>Static website built using HTML and CSS.</p>
    </header>

    <div class="card">
        <h2>CI/CD Pipeline Successful</h2>
        <p>Automated deployment using Jenkins and Docker.</p>
        <p>Website hosted through GitHub Pages.</p>
    </div>

    <footer>
        <p>Jenkins | Docker | GitHub</p>
    </footer>

</body>
</html>
